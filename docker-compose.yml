services:
  zoho-metadata-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    image: zoho-metadata-exporter:latest
    container_name: zoho-metadata-exporter
    ports:
      - "${HOST_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
